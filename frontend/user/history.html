<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - AI ExamPrep</title>
    <link rel="stylesheet" href="../css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <div id="sidebar-placeholder"></div>

        <main class="main-content">
            <div id="topbar-placeholder"></div>

            <div class="dashboard-content">
                <div class="card">
                    <div class="card-title">All Activity</div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Date & Time</th>
                                    <th>Action</th>
                                    <th>Resource</th>
                                    <th>Details/Score</th>
                                </tr>
                            </thead>
                            <tbody id="activityTableBody">
                                <tr>
                                    <td colspan="4" style="text-align: center; padding: 2rem;">Loading activity
                                        history...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/dashboard.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            components.load('sidebar-placeholder', '../components/sidebar.html', 'history');
            components.load('topbar-placeholder', '../components/topbar.html');
            loadHistory();
        });

        async function loadHistory() {
            const tableBody = document.getElementById('activityTableBody');
            try {
                const [quizzes, materials] = await Promise.all([
                    api.getQuizHistory(),
                    api.getMaterials()
                ]);

                const activities = [];
                quizzes.forEach(q => {
                    const scoreIsLegacyPercentage = q.score > q.total;
                    const correctAnswers = scoreIsLegacyPercentage
                        ? Math.round(q.total * q.score / 100)
                        : q.score;
                    const percentage = scoreIsLegacyPercentage
                        ? q.score
                        : Math.round((q.score / q.total) * 100);
                    activities.push({
                        date: new Date(q.date),
                        action: 'Quiz Completed',
                        resource: q.materialTitle || 'General Practice',
                        details: `<strong>${percentage}%</strong> (${correctAnswers}/${q.total})`,
                        status: 'completed'
                    });
                });

                materials.forEach(m => {
                    activities.push({
                        date: new Date(m.uploadedAt),
                        action: `${m.type} processed`,
                        resource: m.title,
                        details: `Notes and ${m.mcqCount} quiz questions ready`,
                        status: 'completed'
                    });
                });

                activities.sort((a, b) => b.date - a.date);

                if (activities.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 2rem;">No activity found yet.</td></tr>';
                    return;
                }

                tableBody.innerHTML = activities.map(act => `
                    <tr>
                        <td>${formatDate(act.date)}</td>
                        <td><span class="status ${escapeHtml(act.status)}">${escapeHtml(act.action)}</span></td>
                        <td>${escapeHtml(act.resource)}</td>
                        <td>${act.details}</td>
                    </tr>
                `).join('');

            } catch (err) {
                console.error(err);
                tableBody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #ef4444; padding: 2rem;">Error loading history.</td></tr>';
            }
        }

        function formatDate(date) {
            if (Number.isNaN(date.getTime())) return 'Unknown date';
            const options = { year: 'numeric', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit' };
            return date.toLocaleDateString('en-US', options);
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[char]);
        }
    </script>
</body>

</html>
