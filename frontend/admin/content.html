<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Management - AI ExamPrep Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        .admin-sidebar {
            background: #111827;
            color: #fff;
        }

        .admin-sidebar .nav-item {
            color: #9ca3af;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div id="sidebar-placeholder"></div>

        <main class="main-content">
            <div id="topbar-placeholder"></div>

            <div class="dashboard-content">
                <div class="card">
                    <div class="card-title">Study Materials (All Users)</div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Title</th>
                                    <th>Type</th>
                                    <th>User ID</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="contentTableBody">
                                <tr>
                                    <td colspan="6" style="text-align:center;">Loading content...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            components.load('sidebar-placeholder', '../components/admin_sidebar.html', 'content');
            components.load('topbar-placeholder', '../components/topbar.html');
            loadContent();
        });

        async function loadContent() {
            try {
                const materials = await api.getAllAdminContent();
                const tbody = document.getElementById('contentTableBody');
                tbody.innerHTML = materials.map(m => `
                    <tr>
                        <td>${m.id}</td>
                        <td>${m.title}</td>
                        <td><span class="status ${m.type === 'PDF' ? 'completed' : 'processing'}">${m.type}</span></td>
                        <td>User #${m.userId}</td>
                        <td>${m.status}</td>
                        <td>
                            <button class="btn btn-outline" style="color:#ef4444; border-color:#ef4444;" onclick="deleteContent(${m.id})">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        async function deleteContent(id) {
            if (confirm('Are you sure you want to delete this material?')) {
                try {
                    await api.deleteAdminContent(id);
                    loadContent();
                } catch (err) {
                    alert(err.message);
                }
            }
        }
    </script>
</body>

</html>
