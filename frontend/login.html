<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI ExamPrep</title>
    <link rel="stylesheet" href="css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="navbar-placeholder"></div>

    <main class="auth-container">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p>Login to access your generated notes and MCQs.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>
                <div id="error-message" style="color: #ef4444; margin-bottom: 1rem; font-size: 0.9rem; display: none;">
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-large">Login</button>
            </form>

            <div class="auth-links">
                <p><a href="#">Forgot your password?</a></p>
                <p>Don't have an account? <a href="register.html">Register here</a></p>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            components.load('navbar-placeholder', 'components/navbar.html', 'login');
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');

            try {
                errorDiv.style.display = 'none';
                const user = await api.login(email, password);
                if (user.role === 'ADMIN') {
                    window.location.href = 'admin/dashboard.html';
                } else {
                    window.location.href = 'user/dashboard.html';
                }
            } catch (error) {
                errorDiv.innerText = error.message;
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>

</html>
