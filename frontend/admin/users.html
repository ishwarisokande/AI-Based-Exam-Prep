<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - AI ExamPrep Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        .admin-sidebar {
            background: #111827;
            color: #fff;
        }

        .admin-sidebar .nav-item {
            color: #9ca3af;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div id="sidebar-placeholder"></div>

        <main class="main-content">
            <div id="topbar-placeholder"></div>

            <div class="dashboard-content">
                <div class="card">
                    <div class="card-title">System Users</div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Join Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="userTableBody">
                                <tr>
                                    <td colspan="6" style="text-align:center;">Loading users...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            components.load('sidebar-placeholder', '../components/admin_sidebar.html', 'users');
            components.load('topbar-placeholder', '../components/topbar.html');
            loadUsers();
        });

        async function loadUsers() {
            try {
                const users = await api.getAllUsers();
                const tbody = document.getElementById('userTableBody');
                tbody.innerHTML = users.map(u => `
                    <tr>
                        <td>${u.id}</td>
                        <td>${u.name}</td>
                        <td>${u.email}</td>
                        <td><span class="status ${u.role === 'ADMIN' ? 'completed' : 'processing'}">${u.role}</span></td>
                        <td>${new Date(u.createdAt).toLocaleDateString()}</td>
                        <td>
                            <button class="btn btn-outline" style="color:#ef4444; border-color:#ef4444;" onclick="deleteUser(${u.id})">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        async function deleteUser(id) {
            if (confirm('Are you sure you want to delete this user?')) {
                try {
                    await api.deleteUser(id);
                    loadUsers();
                } catch (err) {
                    alert(err.message);
                }
            }
        }
    </script>
</body>

</html>
